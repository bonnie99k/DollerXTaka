<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DollerXTaka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Profile Section */
        .profile-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }

        /* Ad Section */
        .task-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .progress-container {
            background: #334155;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin: 15px 0;
            overflow: hidden;
        }

        #progress-bar {
            background: var(--accent);
            height: 100%;
            width: 0%; /* Dynamic */
            transition: width 0.3s ease;
        }

        .btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: var(--card-bg);
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div style="font-size: 0.9rem; color: #94a3b8;">Current Balance</div>
        <div class="balance-amount">$<span id="balance">0.00</span></div>
        <div id="user-name">Welcome, User</div>
    </div>

    <div class="task-card">
        <h3>Daily Video Ads</h3>
        <p style="font-size: 0.85rem; color: #94a3b8;">Watch ads to earn. Limit: 20 per day.</p>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 15px;">
            <span>Progress</span>
            <span id="ad-count">0/20</span>
        </div>

        <button class="btn" id="watch-btn" onclick="watchAd()">Watch Video Ad</button>
    </div>

    <div class="task-card">
        <h3>Withdraw</h3>
        <button class="btn" style="background: var(--success);" onclick="withdraw()">Request Payout</button>
    </div>
